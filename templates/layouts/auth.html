<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Sistema de Gestão de Laboratório</title>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1>Sistema de Gestão de Laboratório</h1>
            <p>{{.Subtitle}}</p>
        </div>

        {{if .FlashMessage}}
            <div class="flash-message {{.FlashType}}">
                {{.FlashMessage}}
            </div>
        {{end}}

        <div class="auth-content">
            {{template "content" .}}
        </div>

        <div class="auth-footer">
            <p>&copy; 2024 Sistema de Gestão de Laboratório</p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    {{block "scripts" .}}{{end}}
</body>
</html>
