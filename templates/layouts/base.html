<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Sistema de Gestão de Laboratório</title>
    <script>
        (function () {
            var saved = localStorage.getItem('cetep_theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
        function toggleTheme() {
            var root = document.documentElement;
            var isDark = root.getAttribute('data-theme') === 'dark';
            var next = isDark ? 'light' : 'dark';
            if (next === 'dark') {
                root.setAttribute('data-theme', 'dark');
            } else {
                root.removeAttribute('data-theme');
            }
            localStorage.setItem('cetep_theme', next);
            var btn = document.getElementById('theme_toggle_btn');
            if (btn) btn.textContent = next === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        }
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('theme_toggle_btn');
            if (btn) {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = isDark ? '☀️ Claro' : '🌙 Escuro';
            }
        });
    </script>
    <link rel="stylesheet" href="/static/css/main.css?v=2">
</head>
<body>
    {{if .User}}
        {{template "navbar" .}}
    {{end}}

    <main class="main-content">
        {{if .FlashMessage}}
            <div class="flash-message {{.FlashType}}">
                {{.FlashMessage}}
            </div>
        {{end}}

        {{template "content" .}}
    </main>

    {{if .User}}
        {{template "footer" .}}
    {{end}}

    <script src="/static/js/main.js"></script>
    {{block "scripts" .}}{{end}}
</body>
</html>
