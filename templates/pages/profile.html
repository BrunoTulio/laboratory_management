{{define "content"}}
<div class="profile-page">
    <div class="page-header">
        <h1>Meu Perfil</h1>
    </div>

    <form method="POST" action="/perfil" class="form">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-section">
            <h2>Informações Pessoais</h2>

            <div class="form-field">
                <label for="name" class="form-label">Nome Completo</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    class="form-input" 
                    value="{{.User.Name}}"
                    required
                >
            </div>

            <div class="form-field">
                <label for="email" class="form-label">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    value="{{.User.Email}}"
                    required
                >
            </div>

            <div class="form-field">
                <label for="registration_number" class="form-label">Matrícula</label>
                <input 
                    type="text" 
                    id="registration_number" 
                    name="registration_number" 
                    class="form-input" 
                    value="{{.User.RegistrationNumber}}"
                    readonly
                >
            </div>

            <div class="form-field">
                <label for="phone" class="form-label">Telefone</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    class="form-input" 
                    value="{{.User.Phone}}"
                >
            </div>

            <div class="form-field">
                <label for="role" class="form-label">Perfil</label>
                <input 
                    type="text" 
                    id="role" 
                    name="role" 
                    class="form-input" 
                    value="{{.User.Role.Name}}"
                    readonly
                >
            </div>

            <div class="form-field">
                <label for="status" class="form-label">Status</label>
                <input 
                    type="text" 
                    id="status" 
                    name="status" 
                    class="form-input" 
                    value="{{.User.Status}}"
                    readonly
                >
            </div>
        </div>

        <div class="form-section">
            <h2>Informações da Conta</h2>

            <div class="form-field">
                <label for="created_at" class="form-label">Data de Cadastro</label>
                <input 
                    type="text" 
                    id="created_at" 
                    name="created_at" 
                    class="form-input" 
                    value="{{.User.CreatedAt.Format "02/01/2006 15:04"}}"
                    readonly
                >
            </div>

            <div class="form-field">
                <label for="updated_at" class="form-label">Última Atualização</label>
                <input 
                    type="text" 
                    id="updated_at" 
                    name="updated_at" 
                    class="form-input" 
                    value="{{.User.UpdatedAt.Format "02/01/2006 15:04"}}"
                    readonly
                >
            </div>
        </div>

        <div class="form-section">
            <h2>Alterar Senha</h2>

            <div class="form-field">
                <label for="current_password" class="form-label">Senha Atual</label>
                <input 
                    type="password" 
                    id="current_password" 
                    name="current_password" 
                    class="form-input"
                >
            </div>

            <div class="form-field">
                <label for="new_password" class="form-label">Nova Senha</label>
                <input 
                    type="password" 
                    id="new_password" 
                    name="new_password" 
                    class="form-input"
                >
            </div>

            <div class="form-field">
                <label for="confirm_password" class="form-label">Confirmar Nova Senha</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    class="form-input"
                >
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="/dashboard" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{{end}}
